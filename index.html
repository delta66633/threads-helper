
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 800px;
            background-color: #000;
            color: #fff;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            opacity: 0.8;
            z-index: -1;
        }
        .accent-bar {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 100px;
            height: 10px;
            background-color: #ff4d4d;
        }
        .container {
            width: 80%;
            text-align: left;
        }
        .category {
            font-size: 24px;
            color: #ff4d4d;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .title {
            font-size: 54px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 40px;
            word-break: keep-all;
        }
        .content {
            font-size: 28px;
            line-height: 1.6;
            color: #ccc;
        }
        .highlight {
            color: #fff;
            font-weight: 700;
            background: linear-gradient(transparent 60%, #ff4d4d 60%);
        }
        .footer {
            margin-top: 60px;
            font-size: 18px;
            color: #666;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="accent-bar"></div>
    <div class="container">
        <div class="category">ECONOMY BREAKING NEWS</div>
        <div class="title">소상공인 <span class="highlight">230만 명</span><br>이자 환급 <span class="highlight">최대 200만 원</span> 확정</div>
        <div class="content">
            - 대상: 제2금융권 대출 이용 소상공인<br>
            - 금액: 1인당 평균 75만 원 (최대 200만 원)<br>
            - 시기: 5월 24일부터 신청 및 환급 시작
        </div>
        <div class="footer">SMART ECONOMY REPORT</div>
    </div>
</body>
</html>
